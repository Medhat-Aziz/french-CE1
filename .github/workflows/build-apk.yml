
name: Build French CE1 APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Check Node and npm
        run: |
          node --version
          npm --version

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Install project dependencies
        run: |
          npm config set legacy-peer-deps true
          npm install --legacy-peer-deps --no-audit --no-fund

      - name: Install Capacitor
        run: |
          npm install @capacitor/core @capacitor/android --legacy-peer-deps --no-audit --no-fund
          npm install --save-dev @capacitor/cli --legacy-peer-deps --no-audit --no-fund

      - name: Configure Capacitor
        shell: bash
        run: |
          if [ ! -f capacitor.config.ts ] && \
             [ ! -f capacitor.config.json ] && \
             [ ! -f capacitor.config.js ] && \
             [ ! -f capacitor.config.mjs ]; then
            cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.medhataziz.frenchce1",
            "appName": "Mon Petit Francais",
            "webDir": "dist"
          }
          EOF
          fi

      - name: Build web application
        run: npm run build

      - name: Verify web build
        run: |
          test -f dist/index.html || {
            echo "ERROR: dist/index.html was not generated"
            exit 1
          }

      - name: Create Android project
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: french-ce1-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
